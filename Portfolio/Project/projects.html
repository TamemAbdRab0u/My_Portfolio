<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details | Portfolio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./projects.css" />
</head>

<body>
    <div id="particle-field"></div>
    <canvas id="stars-canvas"></canvas>
    <div class="cosmic-canvas"></div>
    <div class="atmosphere-layer"></div>
    <div class="planet-ground"></div>

    <div class="landing-overlay" id="landing-sequence">
        <div class="entry-portal-ring"></div>
        <div class="entry-portal-content">
            <h2 id="transition-planet">INITIATING...</h2>
        </div>
    </div>

    <main class="page-container">
        <div class="control-panel" id="control-panel">

            <!-- ═══ TITLE MODULE ═══ -->
            <div class="panel-module mod-title">
                <div class="module-clip">
                    <div class="title-layout">
                        <div class="title-main">
                            <h1 class="gradient-title" id="proj-title">SYNCING...</h1>
                            <p class="objective-text" id="proj-desc">Loading transmission...</p>
                        </div>
                        <div class="title-tech">
                            <div class="tech-groups" id="proj-systems"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ═══ SCREENSHOT MODULE ═══ -->
            <div class="panel-module mod-screenshot">
                <div class="module-clip">
                    <div class="gallery-viewport" id="gallery-viewport">
                        <button class="gallery-arrow prev" id="gallery-prev" aria-label="Previous">◀</button>
                        <button class="gallery-arrow next" id="gallery-next" aria-label="Next">▶</button>
                        <div class="gallery-counter" id="gallery-counter"><span id="gallery-cur">1</span> / <span
                                id="gallery-tot">1</span></div>
                    </div>
                </div>
            </div>

            <!-- ═══ ACTIONS MODULE ═══ -->
            <div class="panel-module mod-actions">
                <div class="module-clip">
                    <a id="proj-live-link" class="action-btn primary" href="#" target="_blank" rel="noopener">
                        <div class="btn-left-group">
                            <span class="btn-icon-circle">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </span>
                            <span class="btn-label">LIVE DEMO</span>
                        </div>
                        <svg class="btn-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </a>
                    <a id="proj-source-link" class="action-btn secondary" href="#" target="_blank" rel="noopener">
                        <div class="btn-left-group">
                            <span class="btn-icon-circle">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                            </span>
                            <span class="btn-label">VIEW SOURCE</span>
                        </div>
                        <svg class="btn-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </a>
                    <a href="../index.html#planet-system-wrap" class="action-btn back" id="back-btn">
                        <div class="btn-left-group">
                            <span class="btn-icon-circle">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            </span>
                            <span class="btn-label">BACK TO SPACE</span>
                        </div>
                        <svg class="btn-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <script src="./projects.js"></script>
</body>

</html>
